
[EMC]
MACHINE = ProducMillCV30
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = gmoccapy
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.000000
MIN_SPINDLE_OVERRIDE = 0.500000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
PROGRAM_PREFIX = /home/seb/linuxcnc/nc_files
INCREMENTS = 5mm 1mm .5mm .1mm .05mm .01mm .005mm
POSITION_FEEDBACK = ACTUAL

DEFAULT_LINEAR_VELOCITY = 10.000000
MAX_LINEAR_VELOCITY = 50.000000
MIN_LINEAR_VELOCITY = 0.500000
DEFAULT_ANGULAR_VELOCITY = 12.000000
DEFAULT_SPINDLE_SPEED = 3000
MAX_ANGULAR_VELOCITY = 180.000000
MIN_ANGULAR_VELOCITY = 1.666667

DEFAULT_SPINDLE_0_SPEED = 3000
MIN_SPINDLE_0_SPEED     = 0
MAX_SPINDLE_0_SPEED     = 4000
MAX_SPINDLE_0_OVERRIDE  = 1.2
MIN_SPINDLE_0_OVERRIDE  = 0.5

EDITOR = gedit
GEOMETRY = xyz
CYCLE_TIME = 100

# ganoppy user button
#USER_BUTTON_1 = door-unlock,Porte,

# GladeVCP Panel - Machine Control
#EMBED_TAB_NAME = Machine Panel
#EMBED_TAB_LOCATION = ntb_user_tabs
#EMBED_TAB_COMMAND = gladevcp -c machine_panel -x {XID} machine_7i96s.glade
EMBED_TAB_NAME = Maintenance
EMBED_TAB_LOCATION = ntb_preview
EMBED_TAB_COMMAND = gladevcp -c machine_7i96s -x {XID} machine_7i96s.glade

EMBED_TAB_NAME = DRO
EMBED_TAB_LOCATION = ntb_user_tabs
EMBED_TAB_COMMAND = gladevcp -x {XID} maintenance.glade

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = G21 G40 G90 G94 G97 G64 P0.025
SUBROUTINE_PATH = macros
REMAP=M6 modalgroup=6 ngc=M6_ATC


[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
# **** This is for info only ****
CARD0=hm2_7i96s.0

[HAL]
HALUI = halui
HALFILE = ProducMillCV30.hal
HALFILE = default_7i96s.hal
HALFILE = caroussel.hal
HALFILE = z_positions.hal
HALFILE = toolchanger.hal
#HALFILE = maunaltoolchange.hal
HALFILE = custom.hal
HALFILE = spindle.hal
POSTGUI_HALFILE = spindle_postgui.hal
POSTGUI_HALFILE = maintenance.hal
#POSTGUI_HALFILE = userbutton_postgui.hal
#POSTGUI_HALFILE = custom_postgui.hal
SHUTDOWN = shutdown.hal

[HALUI]

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
COORDINATES =  XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 20.00
MAX_LINEAR_VELOCITY = 50.00

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl
TOOL_CHANGE_QUILL_UP = 1

